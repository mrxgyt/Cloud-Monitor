kind = "web"
previewPath = "/"
title = "Network Panel"
version = "1.0.0"
id = "artifacts/netpanel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20496

[services.development]
run = "pnpm --filter @workspace/netpanel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/netpanel", "run", "build" ]
publicDir = "artifacts/netpanel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20496"
BASE_PATH = "/"
