services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - netpanel
      - v2ray
    restart: unless-stopped

  netpanel:
    build: .
    expose:
      - "8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
      STATIC_DIR: /app/public
      VPN_HOST: "${VPN_HOST:-localhost}"
      V2RAY_CONFIG_PATH: /app/v2ray-config.json

  v2ray:
    build:
      context: .
      dockerfile: Dockerfile.v2ray
    expose:
      - "8080"
    volumes:
      - ./v2ray-config.json:/etc/v2ray/config.json:ro
    restart: unless-stopped
