services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - netpanel
      - v2ray
    restart: unless-stopped

  netpanel:
    build: .
    expose:
      - "8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
      STATIC_DIR: /app/public
      VPN_HOST: "${VPN_HOST:-}"
      VPN_PUBLIC_PORT: "${VPN_PUBLIC_PORT:-8080}"
      VPN_SECURITY: "${VPN_SECURITY:-none}"
      VPN_FINGERPRINT: "${VPN_FINGERPRINT:-random}"
      VPN_ALPN: "${VPN_ALPN:-h3}"
      VPN_SNI: "${VPN_SNI:-}"
      VPN_WS_HOST: "${VPN_WS_HOST:-}"
      V2RAY_CONFIG_PATH: /etc/v2ray/config.json

  v2ray:
    build:
      context: .
      dockerfile: Dockerfile.v2ray
    expose:
      - "8080"
    volumes:
      - ./v2ray-config.json:/etc/v2ray/config.json:ro
    restart: unless-stopped
